<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Swami Samarth">
<title>Swami Samarth Auto Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f1;--card:#fff;--ink:#241a12;--mute:#6b5d51;--line:#e6dcd0;--ac:#c2410c;--on:#fff;--ok:#2b7a4b;--wa:#a86d05;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110c;--card:#231a13;--ink:#f5ebe0;--mute:#b3a394;--line:#3a2d22;--ac:#ff8a3d;--on:#1a0f06;--ok:#5cc08a;--wa:#e0a63a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#17110c;--card:#231a13;--ink:#f5ebe0;--mute:#b3a394;--line:#3a2d22;--ac:#ff8a3d;--on:#1a0f06;--ok:#5cc08a;--wa:#e0a63a;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Mukta,system-ui,sans-serif}
header{background:var(--ac);color:var(--on);padding:12px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:19px;margin:0;line-height:1.2}header small{opacity:.9}
.logo{width:48px;height:48px;flex:none;border-radius:50%;background:transparent;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h2{font-size:20px;margin:14px 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--mute);font:600 12px Mukta,system-ui;cursor:pointer}
nav button span{display:block;font-size:20px;line-height:1.1}
nav button[aria-current=page]{color:var(--ac)}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
label{display:grid;gap:3px;color:var(--mute);font-size:14px;margin-bottom:10px}
.lb{margin:6px 0 0;color:var(--mute);font-size:14px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
button.card{display:block;width:100%;text-align:left;cursor:pointer}
.top{display:flex;justify-content:space-between;gap:8px}
.pill{font-size:14px;font-weight:600;color:var(--c)}
.mute{color:var(--mute)}.err{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.n{font-size:36px;font-weight:700;color:var(--ac);line-height:1}
.btn{border:0;border-radius:8px;padding:11px 16px;background:var(--ac);color:var(--on);font-weight:600;cursor:pointer}
.btn.big{width:100%;margin:8px 0}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{color:var(--bad);margin-top:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
a.btn{text-decoration:none;display:grid;place-items:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowp>*{min-width:0}
.rowp{display:grid;grid-template-columns:1fr 52px 80px 44px;gap:8px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:transparent;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 0;border-bottom:1px solid var(--line);text-align:left}.r{text-align:right}.gt td{font-weight:700;border-bottom:0}
.bill{background:#fff;color:#000;padding:18px;border-radius:8px;border:1px solid var(--line)}
.bill td,.bill th{border-color:#ddd}.bill .logo{width:76px;height:76px}.bill hr{border:0;border-top:1px solid #ddd}
.bh{display:flex;gap:12px;align-items:center}
#splash{position:fixed;inset:0;z-index:9;background:var(--ac);color:var(--on);display:grid;place-content:center;justify-items:center;gap:14px;font-size:22px;font-weight:700;text-align:center;animation:fade .4s 1.4s forwards}
#splash .logo{width:130px;height:130px;animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes fade{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation-delay:.6s}#splash .logo{animation:none}}
@media print{header,nav,.noprint,#splash{display:none!important}body{background:#fff}main{padding:0}.bill{border:0}}
</style></head><body>

const logo=()=>`<img src="${esc(S.logo||LOGO)}" alt="Shree Swami Samarth Auto Repair logo">`;
const no=j=>String(j.no||0).padStart(4,"0");
const st=j=>`<span class="pill" style="--c:var(${j.done?"--ok":"--wa"})">${j.done?"Completed":"Pending"}</span>`;
const card=j=>`<button class="card" data-o="${j.id}"><div class="top"><b>${esc(j.reg||"No number")}</b>${st(j)}</div>${esc(j.make)} · ${esc(j.cust)}<br><small class="mute">${(j.types||[]).map(esc).join(", ")||"No job type"} · ${rs(total(j))} · ${fmt(j.created)}</small></button>`;
const prow=p=>`<div class="rowp"><input class="pn" placeholder="Part name" aria-label="Part name" value="${esc(p?.name)}"><input class="pq" type="number" min="1" inputmode="numeric" placeholder="Qty" aria-label="Quantity" value="${esc(p?.qty??1)}"><input class="pa" type="number" min="0" inputmode="decimal" placeholder="₹" aria-label="Part cost" value="${esc(p?.amt)}"><button type="button" class="btn ghost" data-a="delpart" aria-label="Remove part">×</button></div>`;
const srow=p=>`<div class="rowp"><select class="ps" aria-label="Spare part">${stock.map(t=>`<option value="${t.id}"${p&&p.sid===t.id?" selected":""}>${esc(lbl(t))} (${t.qty} left)</option>`).join("")}</select><input class="pq" type="number" min="1" inputmode="numeric" aria-label="Quantity" value="${esc(p?.qty??1)}"><input class="pa" type="number" min="0" inputmode="decimal" placeholder="₹" aria-label="Part cost" value="${esc(p?.amt)}"><button type="button" class="btn ghost" data-a="delpart" aria-label="Remove part">×</button></div>`;
const lines=j=>(j.parts||[]).map(p=>`<tr><td>${esc(p.name)}${p.qty>1?" × "+p.qty:""}</td><td class="r">${rs(p.amt)}</td></tr>`).join("")+`<tr><td>Labour</td><td class="r">${rs(j.labour)}</td></tr>`;
const find=()=>jobs.find(x=>x.id===cur);
function results(q){q=q.trim().toLowerCase();if(!q)return`<p class="mute">Type a customer name, mobile number or vehicle number.</p>`;
 const k=q.replace(/\s/g,""),l=jobs.filter(j=>{const h=[j.cust,j.phone,j.reg,j.make,(j.types||[]).join(" ")].join(" ").toLowerCase();return h.includes(q)||h.replace(/\s/g,"").includes(k)});
 return l.length?`<p class="mute">${l.length} result${l.length>1?"s":""}</p>`+l.map(card).join(""):`<p class="mute">No matching jobs.</p>`}
const lbl=x=>x.name+(x.car?" - "+x.car:"");
const CARS=["Maruti Suzuki","Tata","Mahindra","Hyundai","Honda","Toyota","Kia","Renault","Ford","Volkswagen","Skoda","Nissan","MG","Chevrolet"];
const spares=()=>{const L=stock.reduce((t,x)=>t+x.qty,0),U=stock.reduce((t,x)=>t+(x.used||0),0);
 return`<h2>Spare parts</h2><div class="stats"><div class="card"><div class="n">${L}</div>Left in stock</div><div class="card"><div class="n">${U}</div>Used in jobs</div></div><h2>Parts list</h2>`+
 ([...stock].sort((a,b)=>lbl(a).localeCompare(lbl(b))).map(x=>`<div class="card"><div class="top"><b>${esc(x.name)}</b><span class="pill" style="--c:var(${x.qty>0?"--ok":"--bad"})">${x.qty} left</span></div><div class="mute">${x.car?"Fits: "+esc(x.car):"Fits: any car"}</div><div class="top" style="align-items:center"><span class="mute">Used: ${x.used||0}</span><button class="btn ghost danger" style="margin:0;padding:4px 12px" data-a="delstock" data-id="${x.id}">Delete</button></div></div>`).join("")||`<p class="mute">No spare parts yet. Add the first one below.</p>`)+
 `<h2>Add spare part</h2><div class="card"><input id="sn" placeholder="Part name, e.g. Oil filter" aria-label="Spare part name"><datalist id="cars">${CARS.map(c=>`<option value="${c}">`).join("")}</datalist><div class="row" style="grid-template-columns:1fr 90px;margin-top:8px"><input id="sc" list="cars" placeholder="Car company (optional)" aria-label="Car company the part fits"><input id="sq" type="number" min="1" inputmode="numeric" placeholder="Qty" aria-label="Quantity"></div><p class="err" id="serr" role="alert"></p><button class="btn big" data-a="addstock" style="margin:0">Add to stock</button></div>`};
const V={
spares,
dash(){const act=jobs.filter(j=>!j.done).length,td=jobs.filter(j=>new Date(j.created).toDateString()===new Date().toDateString()).length;
 return`<p class="mute" style="margin:0 0 10px;font-size:18px">${new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p><div class="stats"><div class="card"><div class="n">${act}</div>Active jobs</div><div class="card"><div class="n">${td}</div>Added today</div></div><div class="row" style="margin:8px 0"><button class="btn" data-v="new">New job</button><button class="btn ghost" style="color:var(--ac);border-color:var(--ac)" data-v="spares">Spare parts</button></div><h2>Recent jobs</h2>${jobs.slice(0,5).map(card).join("")||`<p class="mute">No jobs yet. Tap New job to create the first one.</p>`}`},
new(){const j=jobs.find(x=>x.id===cur)||{},ty=j.types||[],all=[...TYPES,...ty.filter(t=>!TYPES.includes(t))];
 return`<h2>${j.id?"Edit job":"New job"}</h2><div class="card" id="f" data-id="${j.id||""}">
<label>Customer name<input name="cust" value="${esc(j.cust)}"></label>
<label>Mobile number<input name="phone" type="tel" inputmode="tel" value="${esc(j.phone)}"></label>
<label>Vehicle model<input name="make" value="${esc(j.make)}"></label>
<div class="row"><label>Vehicle number<input name="reg" autocapitalize="characters" value="${esc(j.reg)}"></label><label>Odometer (km)<input name="odo" type="number" inputmode="numeric" value="${esc(j.odo)}"></label></div>
<p class="lb">Job type</p><div class="chips" id="chips">${all.map(t=>`<button type="button" class="chip" aria-pressed="${ty.includes(t)}">${esc(t)}</button>`).join("")}</div>
<div class="row" style="grid-template-columns:1fr auto"><input id="ct" placeholder="Other job type" aria-label="Other job type"><button type="button" class="btn ghost" data-a="addtype">Add</button></div>
<p class="lb">Parts used</p><div id="parts">${(j.parts||[]).map(p=>p.sid&&stock.some(t=>t.id===p.sid)?srow(p):prow(p)).join("")}</div><div class="acts" style="margin:0"><button type="button" class="btn ghost" data-a="addspare">Add spare part</button><button type="button" class="btn ghost" data-a="addpart">Add other part</button></div><p class="mute" style="font-size:13px;margin:6px 0 0">Spare parts reduce stock automatically. Other parts are billed only.</p>
<label style="margin-top:10px">Labour cost (₹)<input name="labour" type="number" min="0" inputmode="decimal" value="${esc(j.labour)}"></label>
<p class="err" id="err" role="alert"></p><button class="btn big" data-a="save">Save job</button></div>`},
all(){const m=j=>filter==="all"||(filter==="done")===j.done;
 return`<h2>All jobs</h2><div class="chips">${[["all","All"],["pend","Pending"],["done","Completed"]].map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${t} ${jobs.filter(j=>k==="all"||(k==="done")===j.done).length}</button>`).join("")}</div>${jobs.filter(m).map(card).join("")||`<p class="mute">No jobs here.</p>`}`},
search(){return`<h2>Search</h2><input id="q" type="search" placeholder="Name, mobile or vehicle number" aria-label="Search jobs"><div id="res" style="margin-top:12px">${results("")}</div>`},
detail(){const j=find();if(!j)return V.all();const h=jobs.filter(x=>x.reg&&x.reg===j.reg&&x.id!==j.id);
 return`<div class="card"><div class="top"><b>${esc(j.reg||"No number")}</b>${st(j)}</div><h2 style="margin:6px 0">${esc(j.make)}</h2>
<p>${esc(j.cust)} · ${j.phone?`<a href="tel:${esc(j.phone)}">${esc(j.phone)}</a>`:"no mobile"}<br>Odometer: ${j.odo?esc(j.odo)+" km":"not recorded"}<br><span class="mute">${fmt(j.created)} · Job #${no(j)}</span></p>
<p><b>Job:</b> ${(j.types||[]).map(esc).join(", ")||"not set"}</p>
<table>${lines(j)}<tr class="gt"><td>Total</td><td class="r">${rs(total(j))}</td></tr></table>
<div class="acts"><button class="btn" data-a="toggle">${j.done?"Mark pending":"Mark completed"}</button><button class="btn ghost" data-a="edit">Edit</button><button class="btn ghost" data-a="bill">Print bill</button></div>
<button class="btn ghost danger" data-a="del">Delete job</button></div>
${j.reg?`<h2>Vehicle history · ${esc(j.reg)}</h2>${h.map(card).join("")||`<p class="mute">No other visits recorded for this vehicle.</p>`}`:""}`},
bill(){const j=find();if(!j)return V.all();
 return`<div class="noprint acts" style="margin:0 0 12px"><button class="btn" data-a="print">Print bill</button><button class="btn ghost" data-a="back">Back</button></div>
<div class="bill"><div class="bh"><span class="logo">${logo()}</span><div><b>${esc(S.name)}</b><br>${esc(S.sub)}<br>${esc(S.addr)} ${esc(S.phone)}</div></div><hr>
<p>Bill no: ${no(j)}<br>Date: ${fmt(Date.now())}<br>Job date: ${fmt(j.created)}</p>
<p><b>${esc(j.cust)}</b> ${esc(j.phone)}<br>${esc(j.make)} · ${esc(j.reg)}${j.odo?" · "+esc(j.odo)+" km":""}</p>
<p>Job: ${(j.types||[]).map(esc).join(", ")||"—"}</p>
<table><tr><th>Item</th><th class="r">Amount</th></tr>${lines(j)}<tr class="gt"><td>Grand total</td><td class="r">${rs(total(j))}</td></tr></table>
<p style="margin-top:16px;text-align:center">${esc(S.note)}</p></div>`},
set(){return`<h2>Settings</h2><div class="card" id="s"><label>Garage name<input name="name" value="${esc(S.name)}"></label><label>Subtitle<input name="sub" value="${esc(S.sub)}"></label><label>Phone<input name="phone" type="tel" value="${esc(S.phone)}"></label><label>Address<textarea name="addr" rows="2">${esc(S.addr)}</textarea></label><label>Bill footer note<input name="note" value="${esc(S.note)}"></label><p class="lb">Contacts</p>${[0,1].map(i=>`<div style="margin-bottom:12px"><input name="cn${i}" aria-label="Contact name" value="${esc(S["cn"+i])}"><div class="row" style="grid-template-columns:1fr auto;margin-top:6px"><input name="cp${i}" type="tel" inputmode="tel" aria-label="Contact phone" value="${esc(S["cp"+i])}"><a class="btn ghost" href="tel:${esc(S["cp"+i])}">Call</a></div></div>`).join("")}<label>Logo<input type="file" id="lg" accept="image/*"></label><button class="btn big" data-a="saveset">Save settings</button><p id="sm" class="mute" role="status"></p></div><h2>Backup</h2><div class="card"><p class="mute" style="margin-top:0">Save a copy of all jobs, spare parts and settings to a file. Do this regularly and keep the file somewhere safe, like Google Drive.</p><button class="btn big" data-a="backup" style="margin-top:0">Download backup</button><label style="margin-top:10px">Restore from a backup file<input type="file" id="rf" accept=".json,application/json"></label><p id="bm" class="mute" role="status"></p></div><p class="mute">Jobs and settings are stored on this device only.</p>`}};
function draw(){
 $("#lg0").innerHTML=logo();$("#t1").textContent=S.name;$("#t2").textContent=S.sub;
 const nv={detail:"all",bill:"all",spares:"dash"}[view]||view;
 document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===nv?"page":"false"));
 $("#app").innerHTML=V[view]();}
function go(v,id){view=v;if(id!==undefined)cur=id;draw();scrollTo(0,0)}
function readS(){document.querySelectorAll("#s [name]").forEach(i=>S[i.name]=i.value.trim())}
function save(){const f=$("#f"),g=n=>f.querySelector(`[name=${n}]`).value.trim();
 const types=[...f.querySelectorAll(".chip[aria-pressed=true]")].map(c=>c.textContent);
 const parts=[...f.querySelectorAll(".rowp")].map(r=>{const sel=r.querySelector(".ps"),t=sel&&stock.find(x=>x.id===sel.value);return{name:t?lbl(t):r.querySelector(".pn").value.trim(),sid:t?t.id:undefined,amt:Number(r.querySelector(".pa").value)||0,qty:Math.max(1,Number(r.querySelector(".pq").value)||1)}}).filter(p=>p.name||p.amt);
 const d={cust:g("cust"),phone:g("phone"),make:g("make"),reg:g("reg").toUpperCase(),odo:g("odo"),labour:Number(g("labour"))||0,types,parts};
 if(!d.cust&&!d.reg){$("#err").textContent="Enter a customer name or a vehicle number.";return}
 let j=jobs.find(x=>x.id===f.dataset.id);
 const inv={},old=j?.inv||{};
 parts.forEach(p=>{if(p.sid)inv[p.sid]=(inv[p.sid]||0)+p.qty});
 for(const id in inv){const t=stock.find(x=>x.id===id);if(inv[id]-(old[id]||0)>t.qty){$("#err").textContent=`Only ${t.qty} of ${lbl(t)} left in stock.`;return}}
 for(const id of new Set([...Object.keys(inv),...Object.keys(old)])){const t=stock.find(x=>x.id===id),dl=(inv[id]||0)-(old[id]||0);if(t){t.qty-=dl;t.used=Math.max(0,(t.used||0)+dl)}}
 d.inv=inv;put("ss_stock",stock);
 if(j)Object.assign(j,d);else{j={id:"j"+Date.now().toString(36),no:Math.max(0,...jobs.map(x=>x.no||0))+1,created:Date.now(),done:false,...d};jobs.unshift(j)}
 put("ss_jobs",jobs);go("detail",j.id)}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-v],[data-o],[data-f],[data-a],.chip");if(!b)return;const d=b.dataset;
 if(d.v)return go(d.v,d.v==="new"?null:undefined);
 if(d.o)return go("detail",d.o);
 if(d.f){filter=d.f;return draw()}
 if(!d.a){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");return}
 const j=find();
 ({addtype(){const i=$("#ct"),t=i.value.trim();if(!t)return;const c=document.createElement("button");c.type="button";c.className="chip";c.setAttribute("aria-pressed","true");c.textContent=t;$("#chips").append(c);i.value=""},
  addpart(){$("#parts").insertAdjacentHTML("beforeend",prow())},
  addspare(){if(!stock.length){$("#err").textContent="Add spare parts to stock on the dashboard first.";return}$("#err").textContent="";$("#parts").insertAdjacentHTML("beforeend",srow())},
  delpart(){b.parentNode.remove()},
  addstock(){const n=$("#sn").value.trim(),c=$("#sc").value.trim(),q=Number($("#sq").value);if(!n||!(q>0)){$("#serr").textContent="Enter a part name and a quantity above 0.";return}
   const t=stock.find(x=>x.name.toLowerCase()===n.toLowerCase()&&(x.car||"").toLowerCase()===c.toLowerCase());if(t)t.qty+=q;else stock.push({id:"s"+Date.now().toString(36),name:n,car:c,qty:q,used:0});put("ss_stock",stock);draw()},
  delstock(){if(!d.sure){d.sure=1;b.textContent="Tap again to confirm";return}stock=stock.filter(x=>x.id!==d.id);put("ss_stock",stock);draw()},
  save,edit(){go("new")},back(){go("detail")},bill(){go("bill")},print(){window.print()},
  toggle(){j.done=!j.done;put("ss_jobs",jobs);draw()},
  del(){if(!d.sure){d.sure=1;b.textContent="Tap again to confirm delete";return}for(const id in j.inv||{}){const t=stock.find(x=>x.id===id);if(t){t.qty+=j.inv[id];t.used=Math.max(0,(t.used||0)-j.inv[id])}}put("ss_stock",stock);jobs=jobs.filter(x=>x!==j);put("ss_jobs",jobs);go("all")},
  saveset(){readS();put("ss_set",S);draw();$("#sm").textContent="Saved."},
  async backup(){const data=JSON.stringify({app:"swami-samarth",v:1,date:new Date().toISOString(),jobs,stock,settings:S},null,1),name="swami-samarth-backup-"+new Date().toISOString().slice(0,10)+".json",m=$("#bm");
   try{const dl=window.claude?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data});m.textContent="Backup saved. Keep the file somewhere safe."}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.append(a);a.click();a.remove();m.textContent="Backup downloaded."}
   }catch(x){m.textContent=x&&x.code==="declined"?"Backup cancelled.":"Could not save the backup on this device."}},
  dorestore(){if(!pend)return;jobs=pend.jobs;stock=pend.stock;if(pend.settings)S={...S,...pend.settings};put("ss_jobs",jobs);put("ss_stock",stock);put("ss_set",S);pend=null;draw();$("#bm").textContent="Backup restored."}})[d.a]?.()});
$("#app").addEventListener("input",e=>{if(e.target.id==="q")$("#res").innerHTML=results(e.target.value)});
$("#app").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(e.target.id!=="lg"||!f)return;readS();
 const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);S.logo=c.toDataURL("image/jpeg",.8);put("ss_set",S);draw()};i.src=r.result};r.readAsDataURL(f)});
let pend=null;
$("#app").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(e.target.id!=="rf"||!f)return;const m=$("#bm"),r=new FileReader();
 r.onload=()=>{try{const b=JSON.parse(r.result);if(!Array.isArray(b.jobs)||!Array.isArray(b.stock))throw 0;pend=b;m.innerHTML=`Backup found: ${b.jobs.length} jobs, ${b.stock.length} spare parts. <button class="btn" style="margin-top:8px" data-a="dorestore">Replace current data with this backup</button>`}catch(x){pend=null;m.textContent="That file is not a valid backup."}};
 r.readAsText(f)});
$("#splash").innerHTML=`<span class="logo">${logo()}</span><p style="margin:0">${esc(S.name)}</p>`;
setTimeout(()=>$("#splash")?.remove(),1900);
draw();
</script>
<style>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';

const firebaseConfig = {

  authDomain: "swami-samarth-auto-garage.firebaseapp.com",
  projectId: "swami-samarth-auto-garage",
  storageBucket: "swami-samarth-auto-garage.firebasestorage.app",
  messagingSenderId: "57987538708",
  appId: "1:57987538708:web:ef1e32d23d595f3b6b2c01",

};
const btn=document.getElementById('ss-google-signin');
